<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="随记广场 —— 一个纯原生实现的迷你动态分享应用" />
  <title>随记广场（原生版）</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231D9BF0'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 顶部标题栏 -->
  <header class="app-header">
    <div class="app-header__inner">
      <div class="app-logo" aria-hidden="true">
        <span class="app-logo__dot"></span>
        <span class="app-logo__dot app-logo__dot--small"></span>
      </div>
      <div class="app-title">
        <h1>随记广场</h1>
        <p>记录你的每一刻</p>
      </div>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="app-main">
    <!-- 发布区卡片 -->
    <section class="composer card" aria-label="发布区">
      <textarea
        id="composer-input"
        class="composer__input"
        rows="3"
        placeholder="分享新鲜事…"
        maxlength="500"
        aria-label="动态内容输入框"
      ></textarea>
      <div class="composer__footer">
        <span id="composer-hint" class="composer__hint" aria-live="polite"></span>
        <button id="composer-submit" class="btn btn--primary" disabled type="button">发布</button>
      </div>
    </section>

    <!-- 动态列表 -->
    <section aria-label="动态列表">
      <ul id="feed-list" class="feed" aria-live="polite"></ul>
      <!-- 空状态提示 -->
      <div id="feed-empty" class="feed__empty">
        <svg class="feed__empty-icon" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="30" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="6 8" />
          <path d="M20 34 Q28 44 44 28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
          <circle cx="24" cy="26" r="2.5" fill="currentColor" />
          <circle cx="40" cy="22" r="2.5" fill="currentColor" />
        </svg>
        <p>还没有内容，快去发布第一条吧</p>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
